<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad-2" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1c1628" />
      <stop offset="100%" stop-color="#0d0d12" />
    </radialGradient>

    <!-- Purple Glow Filter -->
    <filter id="glow-purple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="ambient-purple" cx="45%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0" />
    </radialGradient>

    <!-- Lens Clip Path -->
    <clipPath id="lens-clip">
      <circle cx="34" cy="35" r="16" />
    </clipPath>
  </defs>

  <!-- Dark Background Circle -->
  <circle cx="40" cy="40" r="38" fill="url(#bg-grad-2)" stroke="#2B2B36" stroke-width="1.5" />
  <circle cx="40" cy="40" r="38" fill="url(#ambient-purple)" />

  <!-- Code Block Document (Background) -->
  <rect x="14" y="16" width="40" height="48" rx="4" fill="#13131c" stroke="#2c2c38" stroke-width="1.2" />

  <!-- Muted Code Lines Outside Lens -->
  <line x1="20" y1="24" x2="38" y2="24" stroke="#444455" stroke-width="2.5" stroke-linecap="round" />
  <line x1="20" y1="31" x2="48" y2="31" stroke="#444455" stroke-width="2.5" stroke-linecap="round" />
  <line x1="20" y1="38" x2="44" y2="38" stroke="#444455" stroke-width="2.5" stroke-linecap="round" />
  <line x1="20" y1="45" x2="46" y2="45" stroke="#444455" stroke-width="2.5" stroke-linecap="round" />
  <line x1="20" y1="52" x2="32" y2="52" stroke="#444455" stroke-width="2.5" stroke-linecap="round" />

  <!-- X-Ray Reveal inside Lens (Clipped to Lens Circle) -->
  <g clip-path="url(#lens-clip)">
    <!-- Lens Internal Glow / X-ray field -->
    <circle cx="34" cy="35" r="16" fill="#A78BFA" fill-opacity="0.18" />
    
    <!-- Revealed Glowing Code Anatomy Ribs -->
    <line x1="20" y1="24" x2="42" y2="24" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="31" x2="48" y2="31" stroke="#A78BFA" stroke-width="3.5" stroke-linecap="round" />
    <line x1="20" y1="38" x2="44" y2="38" stroke="#F9A8D4" stroke-width="3.5" stroke-linecap="round" />
    <line x1="20" y1="45" x2="46" y2="45" stroke="#A78BFA" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="52" x2="36" y2="52" stroke="#6EE7B7" stroke-width="3" stroke-linecap="round" />

    <!-- X-Ray Vertical Spine inside Lens -->
    <line x1="34" y1="20" x2="34" y2="50" stroke="#7DD3FC" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.6" />

    <!-- Subtle Lens Glass Glare -->
    <ellipse cx="28" cy="27" rx="6" ry="3" transform="rotate(-30 28 27)" fill="#FFFFFF" opacity="0.25" />
  </g>

  <!-- Magnifying Glass Hardware (Ring & Handle) -->
  <g filter="url(#glow-purple)">
    <!-- Lens Glass Border -->
    <circle cx="34" cy="35" r="16" fill="none" stroke="#A78BFA" stroke-width="2.5" />
    
    <!-- Inner metallic bevel -->
    <circle cx="34" cy="35" r="14.5" fill="none" stroke="#DDD6FE" stroke-width="0.75" opacity="0.5" />

    <!-- Glass Handle (Angled at ~45 degrees) -->
    <path d="M 45.5 46.5 L 61 62" stroke="#A78BFA" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 46 47 L 57 58" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Step Number Badge -->
  <circle cx="64" cy="18" r="9" fill="#12121a" stroke="#A78BFA" stroke-width="1" />
  <text x="64" y="21.5" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" text-anchor="middle">2</text>
</svg>
