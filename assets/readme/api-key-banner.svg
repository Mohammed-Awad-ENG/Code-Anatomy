<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0f14" />
      <stop offset="50%" stop-color="#141520" />
      <stop offset="100%" stop-color="#181a28" />
    </linearGradient>

    <!-- Key Glow Filter -->
    <filter id="key-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Ambient Radial Glow -->
    <radialGradient id="card-glow" cx="12%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0" />
    </radialGradient>

    <!-- Button Gradient -->
    <linearGradient id="btn-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f2335" />
      <stop offset="100%" stop-color="#282a40" />
    </linearGradient>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
  </style>

  <!-- Base Access Pass Card -->
  <rect x="2" y="2" width="796" height="116" rx="14" fill="url(#card-bg)" stroke="#2b2d3d" stroke-width="1.5" />
  <rect x="2" y="2" width="796" height="116" rx="14" fill="url(#card-glow)" />

  <!-- Top Google AI Studio 4-Color Accent Stripe -->
  <g clip-path="inset(0 0 0 0 round 14px 14px 0 0)">
    <rect x="2" y="2" width="199" height="3" fill="#4285F4" />
    <rect x="201" y="2" width="199" height="3" fill="#EA4335" />
    <rect x="400" y="2" width="199" height="3" fill="#FBBC05" />
    <rect x="599" y="2" width="199" height="3" fill="#34A853" />
  </g>

  <!-- Pass Notch / Security Hole Details on Left Edge -->
  <path d="M 2 50 C 7 50 11 54 11 60 C 11 66 7 70 2 70" fill="#0a0a0f" stroke="#2b2d3d" stroke-width="1.5" />

  <!-- Left: Stylized Key Card Icon Container -->
  <g transform="translate(32, 24)">
    <rect x="0" y="0" width="72" height="72" rx="12" fill="#11121c" stroke="#36384d" stroke-width="1.2" />
    <!-- Mini chip contacts in background -->
    <rect x="6" y="6" width="60" height="60" rx="8" fill="none" stroke="#7DD3FC" stroke-width="1" stroke-dasharray="2 3" opacity="0.15" />
    
    <!-- Stylized Modern Security Key Icon -->
    <g filter="url(#key-glow)" transform="translate(18, 18)">
      <!-- Key Ring Head -->
      <circle cx="13" cy="13" r="10" fill="none" stroke="#7DD3FC" stroke-width="2.5" />
      <circle cx="13" cy="13" r="4.5" fill="#11121c" stroke="#7DD3FC" stroke-width="2" />
      <!-- Key Stem / Shaft angled at 45 degrees -->
      <line x1="20" y1="20" x2="35" y2="35" stroke="#7DD3FC" stroke-width="2.5" stroke-linecap="round" />
      <!-- Key Bit / Teeth -->
      <line x1="28" y1="28" x2="32" y2="24" stroke="#7DD3FC" stroke-width="2" stroke-linecap="round" />
      <line x1="33" y1="33" x2="37" y2="29" stroke="#7DD3FC" stroke-width="2" stroke-linecap="round" />
      <!-- Star Sparkle on key head -->
      <circle cx="7" cy="8" r="1.5" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Divider Line Between Key & Text (Perforated Pass Style) -->
  <line x1="124" y1="20" x2="124" y2="100" stroke="#2a2c3a" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Center Content Block -->
  <!-- Top Tag with Google 4-Color Dots -->
  <g transform="translate(144, 25)">
    <!-- 4 Accent Dots -->
    <circle cx="4" cy="9" r="3.5" fill="#4285F4" />
    <circle cx="15" cy="9" r="3.5" fill="#EA4335" />
    <circle cx="26" cy="9" r="3.5" fill="#FBBC05" />
    <circle cx="37" cy="9" r="3.5" fill="#34A853" />
    <!-- Label -->
    <text x="48" y="12.5" fill="#94A3B8" font-size="10.5" font-weight="600" class="font-mono" letter-spacing="1.5">GOOGLE AI STUDIO</text>
    <rect x="180" y="2" width="70" height="15" rx="3" fill="#1f2937" stroke="#374151" stroke-width="0.75" />
    <text x="186" y="12" fill="#6EE7B7" font-size="9" font-weight="700" class="font-mono">FREE TIER</text>
  </g>

  <!-- Main Headline: "Get Your Free API Key" -->
  <text x="144" y="67" fill="#FFFFFF" font-size="22" font-weight="700" class="font-sans" letter-spacing="-0.3">Get Your Free API Key</text>

  <!-- Subtitle with Gemini & quick setup note -->
  <text x="144" y="89" fill="#94A3B8" font-size="12" class="font-sans">
    Power Code Anatomy with <tspan fill="#7DD3FC" font-weight="600">Gemini 2.5 Flash</tspan> • Instant setup, no credit card required
  </text>

  <!-- Right: Access Pass Button Pill -->
  <g transform="translate(636, 36)">
    <!-- Button Background -->
    <rect x="0" y="0" width="136" height="48" rx="24" fill="url(#btn-grad)" stroke="#434661" stroke-width="1.2" />
    
    <!-- Subtle glow ring on button -->
    <rect x="2" y="2" width="132" height="44" rx="22" fill="none" stroke="#7DD3FC" stroke-width="1" stroke-opacity="0.3" />

    <!-- Button Text -->
    <text x="60" y="25" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle" class="font-sans">Get API Key</text>
    <text x="60" y="38" fill="#6EE7B7" font-size="9" font-weight="500" text-anchor="middle" class="font-mono">FREE ACCESS ↗</text>

    <!-- Arrow Icon Circle -->
    <circle cx="114" cy="24" r="12" fill="#2d324d" />
    <path d="M 111 27 L 117 21 M 112 21 L 117 21 L 117 26" fill="none" stroke="#7DD3FC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Right Corner Tech Watermark (Security pass feel) -->
  <text x="778" y="104" fill="#36394d" font-size="8" font-weight="600" text-anchor="end" class="font-mono">GEMINI-API // ACCESS-PASS</text>
</svg>
