<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#0d0d12" />
    </linearGradient>

    <!-- Title gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#DDD6FE" />
    </linearGradient>

    <!-- Accent line gradient -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0" />
      <stop offset="20%" stop-color="#7DD3FC" />
      <stop offset="40%" stop-color="#A78BFA" />
      <stop offset="60%" stop-color="#F9A8D4" />
      <stop offset="80%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#6EE7B7" stop-opacity="0" />
    </linearGradient>

    <!-- Soft center glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.06" />
      <stop offset="60%" stop-color="#A78BFA" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .font-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 700;
      letter-spacing: -1px;
    }
    .font-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 400;
      letter-spacing: 3px;
    }
  </style>

  <!-- Background -->
  <rect width="900" height="300" rx="16" fill="url(#bg)" />

  <!-- Ambient glow -->
  <rect width="900" height="300" rx="16" fill="url(#glow)" />

  <!-- Outer border -->
  <rect x="1" y="1" width="898" height="298" rx="15" fill="none" stroke="#1a1a1f" stroke-width="1" />

  <!-- Spine — dashed center vertical -->
  <line x1="450" y1="30" x2="450" y2="270" stroke="#7DD3FC" stroke-width="1" stroke-dasharray="3 5" opacity="0.15" />

  <!-- Left ribs — ghost code lines -->
  <line x1="120" y1="80" x2="260" y2="80" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round" opacity="0.12" />
  <line x1="120" y1="110" x2="310" y2="110" stroke="#A78BFA" stroke-width="3" stroke-linecap="round" opacity="0.10" />
  <line x1="120" y1="190" x2="280" y2="190" stroke="#A78BFA" stroke-width="3" stroke-linecap="round" opacity="0.10" />
  <line x1="120" y1="220" x2="230" y2="220" stroke="#6EE7B7" stroke-width="3" stroke-linecap="round" opacity="0.12" />

  <!-- Right ribs — ghost code lines -->
  <line x1="780" y1="80" x2="640" y2="80" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round" opacity="0.12" />
  <line x1="780" y1="110" x2="590" y2="110" stroke="#A78BFA" stroke-width="3" stroke-linecap="round" opacity="0.10" />
  <line x1="780" y1="190" x2="620" y2="190" stroke="#A78BFA" stroke-width="3" stroke-linecap="round" opacity="0.10" />
  <line x1="780" y1="220" x2="670" y2="220" stroke="#6EE7B7" stroke-width="3" stroke-linecap="round" opacity="0.12" />

  <!-- Corner brackets — top-left -->
  <polyline points="20,44 20,20 44,20" fill="none" stroke="#7DD3FC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.45" />
  <!-- Corner brackets — top-right -->
  <polyline points="856,20 880,20 880,44" fill="none" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.45" />
  <!-- Corner brackets — bottom-left -->
  <polyline points="20,256 20,280 44,280" fill="none" stroke="#6EE7B7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.45" />
  <!-- Corner brackets — bottom-right -->
  <polyline points="856,280 880,280 880,256" fill="none" stroke="#F9A8D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.45" />

  <!-- Title -->
  <text x="450" y="148" text-anchor="middle" font-size="52" class="font-title" fill="url(#title-grad)">Code Anatomy</text>

  <!-- Accent line -->
  <line x1="300" y1="172" x2="600" y2="172" stroke="url(#accent)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Tagline -->
  <text x="450" y="200" text-anchor="middle" font-size="12" class="font-sub" fill="#64748B">X-RAY VISION FOR WEB ELEMENTS</text>
</svg>
