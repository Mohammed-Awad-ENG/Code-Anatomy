<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="50%" stop-color="#111111" />
      <stop offset="100%" stop-color="#0d0d12" />
    </linearGradient>

    <!-- Ambient Glow Gradients -->
    <radialGradient id="glow-cyan" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-purple" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#A78BFA" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E0F2FE" />
      <stop offset="70%" stop-color="#C7D2FE" />
      <stop offset="100%" stop-color="#DDD6FE" />
    </linearGradient>

    <!-- Scan Beam Gradient -->
    <linearGradient id="scan-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0" />
      <stop offset="45%" stop-color="#7DD3FC" stop-opacity="0.03" />
      <stop offset="50%" stop-color="#7DD3FC" stop-opacity="0.18" />
      <stop offset="55%" stop-color="#A78BFA" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.75" fill="#ffffff" fill-opacity="0.07" />
    </pattern>

    <!-- Glow Filter for Text and Lines -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
    }
    .font-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 500;
      letter-spacing: 2.5px;
    }
  </style>

  <!-- Base Card Background -->
  <rect x="0" y="0" width="900" height="300" rx="20" fill="url(#bg-grad)" />
  <rect x="0" y="0" width="900" height="300" rx="20" fill="url(#glow-cyan)" />
  <rect x="0" y="0" width="900" height="300" rx="20" fill="url(#glow-purple)" />
  <rect x="0" y="0" width="900" height="300" rx="20" fill="url(#grid)" />

  <!-- Outer Card Border -->
  <rect x="1" y="1" width="898" height="298" rx="19" fill="none" stroke="#262626" stroke-width="1.5" />

  <!-- Inner Code Block Container (X-ray body) -->
  <rect x="40" y="30" width="820" height="240" rx="14" fill="#0d0d12" fill-opacity="0.75" stroke="#3B3B3B" stroke-width="1.5" />

  <!-- Window Chrome Header -->
  <line x1="40" y1="62" x2="860" y2="62" stroke="#222226" stroke-width="1" />
  <!-- Window Dots -->
  <circle cx="62" cy="46" r="4.5" fill="#EF4444" opacity="0.75" />
  <circle cx="78" cy="46" r="4.5" fill="#F59E0B" opacity="0.75" />
  <circle cx="94" cy="46" r="4.5" fill="#10B981" opacity="0.75" />

  <!-- Code Tab Indicator -->
  <rect x="120" y="38" width="130" height="18" rx="4" fill="#18181f" stroke="#2a2a33" stroke-width="1" />
  <text x="132" y="51" fill="#7DD3FC" opacity="0.8" font-size="10" class="font-mono">&lt;inspect.tsx&gt;</text>
  <text x="770" y="51" fill="#64748B" font-size="10" class="font-mono">AI DIAGNOSTICS</text>
  <circle cx="758" cy="47" r="3" fill="#6EE7B7" />

  <!-- Anatomy Spine (Vertical central guide) -->
  <line x1="450" y1="75" x2="450" y2="255" stroke="#7DD3FC" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.3" />

  <!-- X-Ray Scan Beam Effect -->
  <rect x="360" y="63" width="180" height="206" fill="url(#scan-beam)" pointer-events="none" />

  <!-- Left Rib Lines (mimicking the icon's anatomy code lines, layered in background) -->
  <!-- Rib 1: Cyan -->
  <line x1="70" y1="92" x2="280" y2="92" stroke="#7DD3FC" stroke-width="5" stroke-linecap="round" opacity="0.7" />
  <circle cx="280" cy="92" r="2" fill="#7DD3FC" />

  <!-- Rib 2: Purple -->
  <line x1="70" y1="126" x2="330" y2="126" stroke="#A78BFA" stroke-width="5" stroke-linecap="round" opacity="0.75" />
  <circle cx="330" cy="126" r="2" fill="#A78BFA" />

  <!-- Rib 3: Pink -->
  <line x1="70" y1="160" x2="240" y2="160" stroke="#F9A8D4" stroke-width="5" stroke-linecap="round" opacity="0.7" />
  <circle cx="240" cy="160" r="2" fill="#F9A8D4" />

  <!-- Rib 4: Purple -->
  <line x1="70" y1="194" x2="310" y2="194" stroke="#A78BFA" stroke-width="5" stroke-linecap="round" opacity="0.75" />
  <circle cx="310" cy="194" r="2" fill="#A78BFA" />

  <!-- Rib 5: Green -->
  <line x1="70" y1="228" x2="260" y2="228" stroke="#6EE7B7" stroke-width="5" stroke-linecap="round" opacity="0.7" />
  <circle cx="260" cy="228" r="2" fill="#6EE7B7" />

  <!-- Right Rib Lines (symmetrical anatomy scan lines) -->
  <!-- Rib 1: Cyan -->
  <line x1="830" y1="92" x2="620" y2="92" stroke="#7DD3FC" stroke-width="5" stroke-linecap="round" opacity="0.7" />
  <circle cx="620" cy="92" r="2" fill="#7DD3FC" />

  <!-- Rib 2: Purple -->
  <line x1="830" y1="126" x2="570" y2="126" stroke="#A78BFA" stroke-width="5" stroke-linecap="round" opacity="0.75" />
  <circle cx="570" cy="126" r="2" fill="#A78BFA" />

  <!-- Rib 3: Pink -->
  <line x1="830" y1="160" x2="660" y2="160" stroke="#F9A8D4" stroke-width="5" stroke-linecap="round" opacity="0.7" />
  <circle cx="660" cy="160" r="2" fill="#F9A8D4" />

  <!-- Rib 4: Purple -->
  <line x1="830" y1="194" x2="590" y2="194" stroke="#A78BFA" stroke-width="5" stroke-linecap="round" opacity="0.75" />
  <circle cx="590" cy="194" r="2" fill="#A78BFA" />

  <!-- Rib 5: Green -->
  <line x1="830" y1="228" x2="640" y2="228" stroke="#6EE7B7" stroke-width="5" stroke-linecap="round" opacity="0.7" />
  <circle cx="640" cy="228" r="2" fill="#6EE7B7" />

  <!-- Center Card Glow Backplate for Text Clarity -->
  <rect x="250" y="80" width="400" height="160" rx="16" fill="#0d0d12" fill-opacity="0.82" />
  <rect x="250" y="80" width="400" height="160" rx="16" fill="url(#glow-center)" />
  <rect x="250" y="80" width="400" height="160" rx="16" fill="none" stroke="#3B3B3B" stroke-width="1" stroke-dasharray="6 4" opacity="0.4" />

  <!-- Inspection Target Crosshair / Reticle in Center -->
  <circle cx="450" cy="155" r="70" fill="none" stroke="#7DD3FC" stroke-width="1" stroke-dasharray="4 6" opacity="0.25" />
  <circle cx="450" cy="155" r="95" fill="none" stroke="#A78BFA" stroke-width="0.75" stroke-dasharray="2 8" opacity="0.2" />

  <!-- Subtle Top Badge: ELEMENT INSPECTOR + AI -->
  <g transform="translate(450, 108)">
    <rect x="-85" y="-12" width="170" height="22" rx="11" fill="#181824" stroke="#7DD3FC" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="-68" cy="-1" r="3" fill="#6EE7B7" />
    <text x="-56" y="2.5" fill="#7DD3FC" font-size="9.5" font-weight="600" class="font-mono" letter-spacing="1.2">AI ELEMENT INSPECTOR</text>
  </g>

  <!-- Title: "Code Anatomy" with Glow -->
  <text x="450" y="162" text-anchor="middle" font-size="44" class="font-title" fill="url(#title-grad)" filter="url(#text-glow)">Code Anatomy</text>

  <!-- Subtitle: "X-Ray Vision for Web Elements" -->
  <text x="450" y="196" text-anchor="middle" font-size="13" class="font-sub" fill="#94A3B8">X-RAY VISION FOR WEB ELEMENTS</text>

  <!-- Bottom Mini Tech Tags -->
  <g transform="translate(450, 222)" text-anchor="middle" font-size="10" class="font-mono">
    <text fill="#64748B">
      <tspan fill="#7DD3FC">&lt;dom&gt;</tspan> • 
      <tspan fill="#A78BFA">computed-styles</tspan> • 
      <tspan fill="#F9A8D4">event-listeners</tspan> • 
      <tspan fill="#6EE7B7">gemini-ai</tspan>
    </text>
  </g>

  <!-- Corner Brackets (from Icon design: 4 X-ray registration marks) -->
  <!-- Top-left -->
  <polyline points="20,44 20,20 44,20" fill="none" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.7" />
  <!-- Top-right -->
  <polyline points="856,20 880,20 880,44" fill="none" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.7" />
  <!-- Bottom-left -->
  <polyline points="20,256 20,280 44,280" fill="none" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.7" />
  <!-- Bottom-right -->
  <polyline points="856,280 880,280 880,256" fill="none" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.7" />

  <!-- Inner code box corner brackets (white subtle) -->
  <polyline points="48,46 48,38 56,38" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  <polyline points="844,38 852,38 852,46" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  <polyline points="48,254 48,262 56,262" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  <polyline points="844,262 852,262 852,254" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
</svg>
