<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <defs>
    <linearGradient id="badge-bg-brave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151b" />
      <stop offset="100%" stop-color="#1c1d26" />
    </linearGradient>
  </defs>

  <style>
    .badge-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 14px; letter-spacing: -0.2px; }
    .badge-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 500; font-size: 9.5px; letter-spacing: 0.5px; }
  </style>

  <!-- Badge Pill Container -->
  <rect x="1" y="1" width="198" height="48" rx="24" fill="url(#badge-bg-brave)" stroke="#333545" stroke-width="1.2" />

  <!-- Accent Light -->
  <path d="M 25 1 L 175 1" stroke="#FB542B" stroke-width="1" stroke-opacity="0.3" stroke-linecap="round" />

  <!-- Brave Lion Shield Icon -->
  <g transform="translate(20, 12)">
    <!-- Shield outline -->
    <path d="M10,1 L18,4 L18,14 C18,20 10,25 10,25 C10,25 2,20 2,14 L2,4 Z" fill="#FB542B" />
    <!-- Inner shield -->
    <path d="M10,3 L16,5.5 L16,14 C16,18.5 10,22.5 10,22.5 C10,22.5 4,18.5 4,14 L4,5.5 Z" fill="#FF7A2F" />
    <!-- Lion mane stripes -->
    <path d="M7,9 L10,7 L13,9" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M7,13 L10,11 L13,13" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M8,17 L10,15 L12,17" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Browser Name -->
  <text x="56" y="24" fill="#FFFFFF" class="badge-title">Brave</text>

  <!-- Status indicator -->
  <circle cx="59" cy="36" r="2.5" fill="#6EE7B7" />
  <text x="66" y="39.5" fill="#6EE7B7" class="badge-sub">Supported</text>

  <!-- Right Pill Accent Arrow -->
  <circle cx="178" cy="25" r="9" fill="#222433" />
  <path d="M 176 21 L 180 25 L 176 29" fill="none" stroke="#7DD3FC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
