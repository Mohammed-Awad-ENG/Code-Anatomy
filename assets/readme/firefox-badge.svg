<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="badge-bg-firefox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151b" />
      <stop offset="100%" stop-color="#1c1d26" />
    </linearGradient>

    <!-- Firefox Flame Gradient -->
    <linearGradient id="firefox-flame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE600" />
      <stop offset="35%" stop-color="#FF7A00" />
      <stop offset="70%" stop-color="#FF2A54" />
      <stop offset="100%" stop-color="#96128C" />
    </linearGradient>

    <!-- Firefox Core Sphere Gradient -->
    <radialGradient id="firefox-core" cx="45%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#4B207D" />
      <stop offset="60%" stop-color="#28114B" />
      <stop offset="100%" stop-color="#180B30" />
    </radialGradient>
  </defs>

  <style>
    .badge-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: -0.2px;
    }
    .badge-sub {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 500;
      font-size: 9.5px;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Badge Pill Container -->
  <rect x="1" y="1" width="198" height="48" rx="24" fill="url(#badge-bg-firefox)" stroke="#333545" stroke-width="1.2" />

  <!-- Subtle Accent Light on Top Border -->
  <path d="M 25 1 L 175 1" stroke="#FF7A00" stroke-width="1" stroke-opacity="0.3" stroke-linecap="round" />

  <!-- Firefox Icon Group -->
  <g transform="translate(17, 12)">
    <!-- Central Inner Globe -->
    <circle cx="13" cy="13" r="10" fill="url(#firefox-core)" />

    <!-- Simplified Iconic Firefox Flame Swirl -->
    <path d="M 13 2 
             C 18 2 23 5.5 24.5 11 
             C 25.5 14.5 24.5 18.5 22 21.5 
             C 19 25 14.5 25.5 10 24.5 
             C 6 23.5 3 20 2.2 16 
             C 1.5 12 3 7.8 6.5 5 
             C 5 7 5.5 9.5 7 11 
             C 8 12 9.5 12.5 10.5 11.5 
             C 11.5 10.5 11.2 9 10.8 7.8 
             C 10 5.5 11 3.2 13 2 Z" 
          fill="url(#firefox-flame)" />

    <!-- Inner Flame Tongue / Wing Highlight -->
    <path d="M 13 6 
             C 17 6 21 9 21.5 13.5 
             C 22 17 19.5 20.5 16 21.5 
             C 18 19.5 19 16.5 18 14 
             C 17.2 12 15 10.5 13 9 
             C 12.2 8.4 12.5 6.8 13 6 Z" 
          fill="#FFE600" opacity="0.85" />

    <!-- Head / Ear of the Fox -->
    <polygon points="12,2 15,4 12,6" fill="#FFB800" />
  </g>

  <!-- Text: Firefox & Supported status -->
  <text x="56" y="24" fill="#FFFFFF" class="badge-title">Firefox</text>

  <!-- Status indicator: Verified / Supported -->
  <circle cx="59" cy="36" r="2.5" fill="#6EE7B7" />
  <text x="66" y="39.5" fill="#6EE7B7" class="badge-sub">Supported</text>

  <!-- Right Pill Accent Arrow -->
  <circle cx="178" cy="25" r="9" fill="#222433" />
  <path d="M 176 21 L 180 25 L 176 29" fill="none" stroke="#FF7A00" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
