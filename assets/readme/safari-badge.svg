<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <defs>
    <linearGradient id="badge-bg-safari" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151b" />
      <stop offset="100%" stop-color="#1c1d26" />
    </linearGradient>
    <linearGradient id="safari-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5AC8FA" />
      <stop offset="100%" stop-color="#007AFF" />
    </linearGradient>
  </defs>

  <style>
    .badge-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 14px; letter-spacing: -0.2px; }
    .badge-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 500; font-size: 9.5px; letter-spacing: 0.5px; }
  </style>

  <!-- Badge Pill Container -->
  <rect x="1" y="1" width="198" height="48" rx="24" fill="url(#badge-bg-safari)" stroke="#333545" stroke-width="1.2" />

  <!-- Accent Light -->
  <path d="M 25 1 L 175 1" stroke="#5AC8FA" stroke-width="1" stroke-opacity="0.3" stroke-linecap="round" />

  <!-- Safari Icon (compass) -->
  <g transform="translate(20, 11)">
    <circle cx="10" cy="13" r="12" fill="#111" />
    <circle cx="10" cy="13" r="11" fill="url(#safari-grad)" />
    <!-- Compass ring -->
    <circle cx="10" cy="13" r="9" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.5" />
    <!-- Compass needle -->
    <polygon points="10,4 12,12 10,14 8,12" fill="#FFFFFF" />
    <polygon points="10,22 8,14 10,12 12,14" fill="#E74C3C" />
    <!-- Tick marks -->
    <line x1="10" y1="3" x2="10" y2="5" stroke="#FFFFFF" stroke-width="0.8" />
    <line x1="10" y1="21" x2="10" y2="23" stroke="#FFFFFF" stroke-width="0.8" />
    <line x1="0" y1="13" x2="2" y2="13" stroke="#FFFFFF" stroke-width="0.8" />
    <line x1="18" y1="13" x2="20" y2="13" stroke="#FFFFFF" stroke-width="0.8" />
  </g>

  <!-- Browser Name -->
  <text x="56" y="24" fill="#FFFFFF" class="badge-title">Safari</text>

  <!-- Status indicator: NOT supported (orange) -->
  <circle cx="59" cy="36" r="2.5" fill="#F59E0B" />
  <text x="66" y="39.5" fill="#F59E0B" class="badge-sub">Unsupported</text>

  <!-- Right Pill Accent Arrow -->
  <circle cx="178" cy="25" r="9" fill="#222433" />
  <path d="M 176 21 L 180 25 L 176 29" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
