<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="badge-bg-chrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151b" />
      <stop offset="100%" stop-color="#1c1d26" />
    </linearGradient>

    <!-- Chrome Disc Clip -->
    <clipPath id="chrome-circle">
      <circle cx="30" cy="25" r="13" />
    </clipPath>

    <!-- Subtle Glow -->
    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .badge-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: -0.2px;
    }
    .badge-sub {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 500;
      font-size: 9.5px;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Badge Pill Container -->
  <rect x="1" y="1" width="198" height="48" rx="24" fill="url(#badge-bg-chrome)" stroke="#333545" stroke-width="1.2" />

  <!-- Subtle Accent Light on Top Border -->
  <path d="M 25 1 L 175 1" stroke="#4285F4" stroke-width="1" stroke-opacity="0.3" stroke-linecap="round" />

  <!-- Chrome Icon -->
  <g transform="translate(0, 0)">
    <!-- Chrome Outer Shadow -->
    <circle cx="30" cy="25" r="13" fill="#111" />

    <!-- Chrome Sectors clipped to circle -->
    <g clip-path="url(#chrome-circle)">
      <!-- Yellow Base Sector (Bottom Right) -->
      <rect x="15" y="10" width="30" height="30" fill="#FBBC05" />
      
      <!-- Red Sector (Top) -->
      <polygon points="12,12 48,12 30,25 12,25" fill="#EA4335" />
      <path d="M 16 12 L 44 12 L 34.5 28.5 A 5.5 5.5 0 0 1 25.5 22.5 Z" fill="#EA4335" />

      <!-- Green Sector (Bottom Left) -->
      <polygon points="12,12 25.5,22.5 17 38 12,38" fill="#34A853" />
      <path d="M 25.5 22.5 L 17 38 L 36 38 A 13 13 0 0 0 34.5 28.5 Z" fill="#34A853" />
    </g>

    <!-- Chrome Inner White Border & Blue Core -->
    <circle cx="30" cy="25" r="6" fill="#FFFFFF" />
    <circle cx="30" cy="25" r="4.8" fill="#4285F4" />
  </g>

  <!-- Text: Chrome & Supported status -->
  <!-- Browser Name -->
  <text x="56" y="24" fill="#FFFFFF" class="badge-title">Chrome</text>

  <!-- Status indicator: Verified / Supported -->
  <circle cx="59" cy="36" r="2.5" fill="#6EE7B7" />
  <text x="66" y="39.5" fill="#6EE7B7" class="badge-sub">Supported</text>

  <!-- Right Pill Accent Arrow -->
  <circle cx="178" cy="25" r="9" fill="#222433" />
  <path d="M 176 21 L 180 25 L 176 29" fill="none" stroke="#7DD3FC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
